# Composed under `generator:` (no @package _global_).
_target_: asr_thesis_project.generator.text_generator.HuggingFaceGenerator
system_prompt: ${system_prompt}

# Base model must match the one the adapter was trained on (model/llama.yaml -> 1B).
model_path: "meta-llama/Llama-3.2-1B-Instruct"
# Point at the saved training run so the chat template matches training
# (create_llama3_tokenizer has no date preamble; the stock template does).
# e.g. "models/Llama-3.2-1B-Instruct/result". null -> falls back to model_path.
tokenizer_path: null
# LoRA adapter directory, e.g. "models/Llama-3.2-1B-Instruct/result". null -> base model.
# A non-existent path now raises instead of silently evaluating the base model.
peft_path: null

max_new_tokens: 256
temperature: 0.2
do_sample: true
max_input_length: 2048
