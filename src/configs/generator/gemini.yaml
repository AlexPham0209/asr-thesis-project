# Composed under `generator:` (no @package _global_).
_target_: asr_thesis_project.generator.text_generator.GeminiGenerator
api_key: ${oc.env:GEMINI_API_KEY}
system_prompt: ${system_prompt}
model_name: "gemini-3.7-flash"   # gemini-2.0-flash was shut down 2026-06-01; 3.6/2.5-flash also work

temperature: 0.2
max_output_tokens: 512
thinking_budget: 0       # thinking shares the output budget; 0 = off. null = model default
max_concurrent: 4
use_async: true
retry_attempts: 5
