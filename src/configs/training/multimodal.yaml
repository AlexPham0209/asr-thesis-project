# @package _global_

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1e-4
  max_steps: 5000
  lr_scheduler_type: "linear"
  warmup_steps: 50
  gradient_checkpointing: true
  # non-reentrant checkpointing works with PEFT without enable_input_require_grads()
  gradient_checkpointing_kwargs:
    use_reentrant: false

  per_device_eval_batch_size: 1
  eval_accumulation_steps: 8

  eval_strategy: "steps"
  eval_steps: 250
  save_strategy: "steps"
  save_steps: 250
  save_total_limit: 3
  logging_strategy: "steps"
  logging_steps: 50
  report_to: tensorboard

  load_best_model_at_end: true
  metric_for_best_model: "cer"      # teacher-forced CER from create_llm_metric
  greater_is_better: false
  push_to_hub: false

  dataloader_num_workers: 4         # the collator runs the mel extractor per batch
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  torch_compile: false
