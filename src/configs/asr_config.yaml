# @package _global_

defaults:
  - model: whisper_small   
  - dataset: speech2latex    
  - training: seq2seq
  - lora: whisper
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

logging_directory: logs
model_directory: models
results_directory: results

# Misc. Settings
normalize_during_preprocessing: false
use_lora: true
use_hyperparameter_search: true
n_trials: 2
use_timestamp: false

resume_from_checkpoint: false