[project]
name = "asr-thesis-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "antlr4-python3-runtime>=4.9.3",
    "audioop-lts>=0.2.2",
    "bleu>=0.3",
    "datasets[audio]>=5.0.0",
    "evaluate>=0.4.6",
    "hydra-core>=1.3.3",
    "jiwer>=4.0.0",
    "lark>=1.3.1",
    "matplotlib>=3.11.1",
    "nltk>=3.10.3",
    "optuna>=4.9.0",
    "peft>=0.20.0",
    "pydub>=0.25.1",
    "pykatex>=0.1.1",
    "pylatexenc>=2.11",
    "pytest>=9.1.1",
    "rouge-score>=0.1.2",
    "ruff>=0.15.20",
    "sacrebleu>=2.6.0",
    "selenium>=4.46.0",
    "sympy>=1.14.0",
    "tensorboard>=2.21.0",
    "torch>=2.11.0",
    "torchcodec>=0.14.0",
    "torchvision>=0.26.0",
    "transformers[torch]>=5.12.1",
    "whisper-normalizer>=0.1.15",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp[default]>=2026.7.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]


